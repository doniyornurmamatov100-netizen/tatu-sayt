<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TATU - Tizimga kirish</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-sm border-0 p-4" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h2 class="h4 text-primary fw-bold">TATU-SAYT</h2>
            <p class="text-muted small">Tizimga kirish uchun ma'lumotlaringizni kiriting</p>
        </div>

        <!-- Login Formasi -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label for="username" class="form-label">Foydalanuvchi nomi:</label>
                <input type="text" class="form-control" id="username" placeholder="Masalan: doniyor" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Parol:</label>
                <input type="password" class="form-control" id="password" placeholder="Parolni kiriting" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Kirish</button>
        </form>
    </div>

    <!-- JavaScript faylini ulaymiz -->
    <script src="js/main.js"></script>
</body>
</html>
